# Backup caller for the production scan. Manual only.
# Vercel cron in vercel.json runs the scheduled scans every 15 minutes
# during market hours. This workflow had no CRON_SECRET, so its schedule
# failed on every run and sent "Run failed" emails. The schedule is off.
#
# To use it as a backup later:
# 1. Add a GitHub Actions secret named CRON_SECRET with the same value
#    already stored in Vercel (repo Settings, Secrets and variables, Actions).
# 2. Put the schedule block back under "on:".
# If a scan already finished in the last 10 minutes, the route exits
# without reading Schwab, so the two callers do not double the request budget.

name: Market scan

on:
  workflow_dispatch:

permissions:
  contents: none

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the production scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set."
            echo "Add it under GitHub → Settings → Secrets and variables → Actions."
            echo "Use the same value as the CRON_SECRET already stored in Vercel."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 330 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://options-scan.vercel.app/api/cron"
          echo
